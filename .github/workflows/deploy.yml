name: Deploy

on:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build, Push, and Deploy (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      SECRET_ID: ${{ github.ref_name == 'main' && 'orgsession/prod/config' || 'orgsession/dev/config' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify secret exists
        run: |
          if ! aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "ERROR: Secret '$SECRET_ID' not found in Secrets Manager."
            echo "The infrastructure must be provisioned via the OrgSession-IAC pipeline before deploying."
            exit 1
          fi

      - name: Read deployment config from Secrets Manager
        id: config
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString \
            --output text)
          echo "ecr_repository_name=$(echo "$SECRET" | jq -r .ecr_repository_name)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster_name=$(echo "$SECRET"    | jq -r .ecs_cluster_name)"    >> "$GITHUB_OUTPUT"
          echo "ecs_service_name=$(echo "$SECRET"    | jq -r .ecs_service_name)"    >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.config.outputs.ecr_repository_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        env:
          ECS_SERVICE: ${{ steps.config.outputs.ecs_service_name }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_SERVICE" \
            --query taskDefinition \
            --output json > task-definition.json
          echo "Downloaded task definition:"
          cat task-definition.json

      - name: Render new task definition with updated image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-def@v1
        with:
          task-definition: task-definition.json
          container-name: orgsession-be
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-def@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ steps.config.outputs.ecs_service_name }}
          cluster: ${{ steps.config.outputs.ecs_cluster_name }}
          wait-for-service-stability: true
