name: Deploy

on:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build, Push, and Deploy (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      SECRET_ID: ${{ github.ref_name == 'main' && 'orgsession/prod/config' || 'orgsession/dev/config' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify secret exists
        run: |
          if ! aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "ERROR: Secret '$SECRET_ID' not found in Secrets Manager."
            echo "The infrastructure must be provisioned via the OrgSession-IAC pipeline before deploying."
            echo "Run terraform apply for the target environment first, then re-run this workflow."
            exit 1
          fi

      - name: Read deployment config from Secrets Manager
        id: config
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString \
            --output text)
          echo "ecr_repository_url=$(echo "$SECRET" | jq -r .ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_name=$(echo "$SECRET" | jq -r .ecr_repository_name)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster_name=$(echo "$SECRET"   | jq -r .ecs_cluster_name)"    >> "$GITHUB_OUTPUT"
          echo "ecs_service_name=$(echo "$SECRET"   | jq -r .ecs_service_name)"    >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.config.outputs.ecr_repository_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Register new ECS task definition and deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.config.outputs.ecr_repository_name }}
          ECS_CLUSTER: ${{ steps.config.outputs.ecs_cluster_name }}
          ECS_SERVICE: ${{ steps.config.outputs.ecs_service_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TASK_FAMILY="${ECS_SERVICE}"

          # Get current task definition and replace only the image
          CURRENT_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --region "$AWS_REGION" \
            --query taskDefinition)

          NEW_TASK_DEF=$(echo "$CURRENT_TASK_DEF" | jq \
            --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)')

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          echo "Registered new task definition: $NEW_TASK_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_ARN" \
            --region "$AWS_REGION"

      - name: Wait for ECS deployment to stabilize
        env:
          ECS_CLUSTER: ${{ steps.config.outputs.ecs_cluster_name }}
          ECS_SERVICE: ${{ steps.config.outputs.ecs_service_name }}
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
