name: Deploy

on:
  push:
    branches:
      - development
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build, Push, and Deploy (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    env:
      SECRET_ID: ${{ github.ref_name == 'main' && 'orgsession/prod/config' || 'orgsession/dev/config' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify secret exists
        run: |
          if ! aws secretsmanager describe-secret \
              --secret-id "$SECRET_ID" \
              --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "ERROR: Secret '$SECRET_ID' not found in Secrets Manager."
            echo "Run terraform apply for the target environment first."
            exit 1
          fi

      - name: Read deployment config from Secrets Manager
        id: config
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString \
            --output text)
          echo "ecr_repository_name=$(echo "$SECRET" | jq -r .ecr_repository_name)" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster_name=$(echo "$SECRET"    | jq -r .ecs_cluster_name)"    >> "$GITHUB_OUTPUT"
          echo "ecs_service_name=$(echo "$SECRET"    | jq -r .ecs_service_name)"    >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.config.outputs.ecr_repository_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            -t "$IMAGE" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Register new task definition and deploy to ECS
        env:
          ECS_CLUSTER: ${{ steps.config.outputs.ecs_cluster_name }}
          ECS_SERVICE: ${{ steps.config.outputs.ecs_service_name }}
          NEW_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          TASK_FAMILY="$ECS_SERVICE"

          echo "Fetching current task definition for family: $TASK_FAMILY"
          CURRENT=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --region "$AWS_REGION" \
            --query taskDefinition \
            --output json)

          echo "Current image: $(echo "$CURRENT" | jq -r '.containerDefinitions[0].image')"
          echo "New image:     $NEW_IMAGE"

          # Build a clean task definition with only the fields accepted by register-task-definition
          # and swap the container image
          NEW_TASK_DEF=$(echo "$CURRENT" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            '{
              family:                  .family,
              executionRoleArn:        .executionRoleArn,
              taskRoleArn:             .taskRoleArn,
              networkMode:             .networkMode,
              requiresCompatibilities: .requiresCompatibilities,
              cpu:                     .cpu,
              memory:                  .memory,
              volumes:                 .volumes,
              containerDefinitions: [
                .containerDefinitions[] |
                if .name == "orgsession-be" then .image = $IMAGE else . end
              ]
            }')

          echo "Registering new task definition..."
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered: $NEW_TASK_ARN"

          echo "Updating ECS service..."
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_ARN" \
            --region "$AWS_REGION"

          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

          echo "Deployment complete."
